<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <pattern id="weave" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 .5H7M0 4.5H7" stroke="#fff" stroke-opacity=".09" stroke-width=".45" stroke-dasharray="2 1"/>
      <path d="M1.5 0V7M5.5 0V7" stroke="#080606" stroke-opacity=".065" stroke-width=".4" stroke-dasharray="1 2"/>
      <path d="M0 2.5H7M3.5 0V7" stroke="#fff" stroke-opacity=".035" stroke-width=".3"/>
    </pattern>
    <filter id="fiber" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .58" numOctaves="3" seed="29" stitchTiles="stitch" result="warp"/>
      <feTurbulence type="fractalNoise" baseFrequency=".62 .022" numOctaves="2" seed="47" stitchTiles="stitch" result="weft"/>
      <feBlend in="warp" in2="weft" mode="multiply" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncR type="linear" slope="1.45" intercept="-.24"/>
        <feFuncG type="linear" slope="1.45" intercept="-.24"/>
        <feFuncB type="linear" slope="1.45" intercept="-.24"/>
        <feFuncA type="linear" slope=".5"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="192" height="192" fill="url(#weave)"/>
  <rect width="192" height="192" fill="#fff" filter="url(#fiber)" opacity=".62"/>
</svg>
